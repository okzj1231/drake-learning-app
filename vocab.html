<!DOCTYPE html>
<html lang="en" class="auth-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Teacher – Vocabulary</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14B8A6" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Teacher" />
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js"></script>
  <script src="pwa.js" defer></script>
  <style>
    :root {
      --teal: #14B8A6;
      --teal-dark: #0F9F8F;
      --accent-text: #0F9F8F;
      --surface: #FFFFFF;
      --border-strong: #D6D3D1;
      --bg: #F5F5F4;
      --border: #E5E5E4;
      --text: #1C1917;
      --muted: #78716C;
      --grey-btn: #E7E5E4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 960px;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
    }

    /* App navigation: top bar on desktop, bottom tab bar on mobile */
    .tabbar {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }

    .tab svg { width: 18px; height: 18px; flex-shrink: 0; }
    .tab:hover { background: var(--bg); color: var(--text); }
    .tab.active { background: rgba(20, 184, 166, 0.12); color: var(--accent-text); }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--teal);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .page-title { font-weight: 600; font-size: 17px; }
    .page-subtitle { font-size: 13px; color: var(--muted); }

    /* Topic tabs */
    .topics {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .topics::-webkit-scrollbar { display: none; }

    .topic {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .topic:hover { border-color: var(--teal); }

    .topic.active {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    /* Scrollable content */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 24px;
    }

    .progress {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .progress-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .progress-label { font-size: 15px; }
    .progress-label strong { color: var(--accent-text); }

    .reset-btn {
      border: none;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }

    .reset-btn:hover { color: var(--text); }

    .bar {
      height: 10px;
      background: var(--grey-btn);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      background: var(--teal);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* Flashcards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Sits on top of the card (not inside the flip button) so it works on both sides */
    .speak-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .speak-btn:hover { border-color: var(--teal); }
    .speak-btn:active { transform: scale(0.92); }
    .speak-btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

    .speak-btn.speaking {
      border-color: var(--teal);
      background: rgba(20, 184, 166, 0.12);
      animation: speak-pulse 0.8s ease-in-out infinite;
    }

    @keyframes speak-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.35); }
      50%      { box-shadow: 0 0 0 6px rgba(20, 184, 166, 0); }
    }

    .flip {
      position: relative;
      height: 220px;
      border: none;
      background: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      perspective: 1000px;
      border-radius: 18px;
    }

    .flip:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.3, 0.7, 0.3, 1);
    }

    .card.flipped .card-inner { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 1px 2px rgba(28, 25, 23, 0.04);
    }

    .card.current .face { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2); }

    .front .word { font-size: 30px; font-weight: 700; line-height: 1.2; }
    .front .hint { margin-top: 10px; font-size: 13px; color: var(--muted); }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .badge.known { background: rgba(20, 184, 166, 0.12); color: var(--accent-text); }
    .badge.learning { background: var(--grey-btn); color: var(--muted); }

    .back {
      transform: rotateY(180deg);
      border-top: 4px solid var(--teal);
      gap: 4px;
    }

    .back .translation { font-size: 24px; font-weight: 700; line-height: 1.3; }

    .back .say {
      margin-top: 8px;
      font-size: 14px;
      color: var(--accent-text);
      font-weight: 600;
    }

    .back .example {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.4;
      font-style: italic;
      width: 100%;
    }

    .actions {
      display: flex;
      gap: 8px;
      visibility: hidden;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    }

    .card.flipped .actions { visibility: visible; opacity: 1; transform: none; }

    .actions button {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 10px 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-known { background: var(--teal); color: #fff; }
    .btn-known:hover { background: var(--teal-dark); }
    .btn-learning { background: var(--grey-btn); color: var(--text); }
    .btn-learning:hover { background: var(--border-strong); }

    @media (max-width: 640px) {
      .tabbar {
        order: 99;
        gap: 0;
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
        border-bottom: none;
        border-top: 1px solid var(--border);
      }
      .tab {
        flex: 1;
        flex-direction: column;
        gap: 2px;
        padding: 6px;
        font-size: 11px;
        border-radius: 12px;
      }
      .tab svg { width: 22px; height: 22px; }
      .tab.active { background: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card-inner, .actions, .bar-fill { transition: none; }
    }

    /* Hidden until the login check finishes, so logged-out visitors never see the page */
    .auth-pending body { visibility: hidden; }
  </style>
</head>
<body>
  <div class="app">
    <nav class="tabbar" aria-label="Main">
      <a class="tab" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7" /><path d="M5 10v10h14V10" /></svg>
        <span>Dashboard</span>
      </a>
      <a class="tab active" href="vocab.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="14" rx="2" /><path d="M8 3h11a2 2 0 0 1 2 2v12" /></svg>
        <span>Vocab</span>
      </a>
      <a class="tab" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" /></svg>
        <span>Practice</span>
      </a>
      <a class="tab" href="dashboard.html#progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M7 16v-6M12 16V5M17 16v-3" /></svg>
        <span>Progress</span>
      </a>
    </nav>

    <header>
      <div class="avatar" aria-hidden="true">Aa</div>
      <div>
        <div class="page-title">Vocabulary</div>
        <div class="page-subtitle">Tap a card to see the meaning</div>
      </div>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>
    </header>

    <div class="topics" id="topics" role="tablist" aria-label="Topics"></div>

    <main>
      <section class="progress" aria-live="polite">
        <div class="progress-row">
          <span class="progress-label" id="progressLabel"></span>
          <button class="reset-btn" id="resetBtn" type="button">Reset topic</button>
        </div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      </section>

      <div class="grid" id="grid"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="vocab-data.js"></script>
  <script src="activity.js"></script>
  <script>
    const PROGRESS_KEY = "sensei.vocab.progress";
    const TOPIC_KEY = "sensei.vocab.topic";
    const LAST_STUDIED_KEY = "sensei.vocab.lastStudied";

    const topicsEl = document.getElementById("topics");
    const gridEl = document.getElementById("grid");
    const progressLabel = document.getElementById("progressLabel");
    const barFill = document.getElementById("barFill");
    const resetBtn = document.getElementById("resetBtn");

    // { "greetings:Hello": "known" | "learning" }
    let progress = loadProgress();
    let activeTopic = loadTopic();

    function loadProgress() {
      try {
        return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
      } catch {
        // Storage unavailable (private mode etc.) — progress lasts for this visit only
      }
    }

    function loadTopic() {
      try {
        const saved = localStorage.getItem(TOPIC_KEY);
        if (saved && VOCAB[saved]) return saved;
      } catch {}
      return "greetings";
    }

    function wordKey(topic, word) {
      return `${topic}:${word.en}`;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderTopics() {
      topicsEl.innerHTML = "";
      for (const [id, topic] of Object.entries(VOCAB)) {
        const btn = el("button", "topic" + (id === activeTopic ? " active" : ""), topic.label);
        btn.type = "button";
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", id === activeTopic);
        btn.addEventListener("click", () => selectTopic(id));
        topicsEl.appendChild(btn);
      }
    }

    function renderProgress() {
      const words = VOCAB[activeTopic].words;
      const known = words.filter(w => progress[wordKey(activeTopic, w)] === "known").length;
      progressLabel.innerHTML = "";
      progressLabel.append(el("strong", "", known), ` of ${words.length} words known`);
      barFill.style.width = `${(known / words.length) * 100}%`;
    }

    function renderBadge(card, status) {
      card.querySelector(".badge")?.remove();
      if (!status) return;
      const badge = el("span", `badge ${status}`, status === "known" ? "✓ Known" : "Learning");
      card.querySelector(".front").appendChild(badge);
    }

    // Basic spaced repetition: "Still learning" cards come up 3× as often as known ones.
    // Unmarked cards count as not known yet, so they get the same weight as learning ones.
    const REVIEW_WEIGHT = { learning: 3, unmarked: 3, known: 1 };
    const SORT_ORDER = { learning: 0, unmarked: 1, known: 2 };

    // The active topic's words in on-screen order; mark() indexes into this
    let deck = [];

    function statusOf(word) {
      return progress[wordKey(activeTopic, word)] || "unmarked";
    }

    // Learning cards first, known cards last (sort is stable, so each group keeps its original order).
    // Only done when a topic opens: re-sorting after each answer would move cards under the student's finger.
    function sortedDeck() {
      return [...VOCAB[activeTopic].words].sort((a, b) => SORT_ORDER[statusOf(a)] - SORT_ORDER[statusOf(b)]);
    }

    // Weighted random pick of the next card to review, never the one just answered
    function pickNextIndex(currentIndex) {
      const candidates = deck
        .map((word, i) => ({ i, weight: REVIEW_WEIGHT[statusOf(word)] }))
        .filter(c => c.i !== currentIndex);
      const total = candidates.reduce((sum, c) => sum + c.weight, 0);
      let roll = Math.random() * total;
      for (const c of candidates) {
        roll -= c.weight;
        if (roll < 0) return c.i;
      }
      return candidates[candidates.length - 1].i;
    }

    function renderGrid() {
      gridEl.innerHTML = "";
      deck = sortedDeck();
      deck.forEach((word, i) => {
        const card = el("div", "card");

        const flip = el("button", "flip");
        flip.type = "button";
        flip.setAttribute("aria-label", `${word.en}. Tap to flip`);

        const inner = el("div", "card-inner");

        const front = el("div", "face front");
        front.append(el("div", "word", word.en), el("div", "hint", "Tap to flip ↻"));

        const back = el("div", "face back");
        back.append(
          el("div", "translation", word.it),
          el("div", "say", `🔊 ${word.say}`),
          el("div", "example", `“${word.ex}”`)
        );

        inner.append(front, back);
        flip.appendChild(inner);
        flip.addEventListener("click", () => {
          card.classList.toggle("flipped");
          setCurrent(card);
        });

        const actions = el("div", "actions");
        const knownBtn = el("button", "btn-known", "I know it ✓");
        const learningBtn = el("button", "btn-learning", "Still learning");
        knownBtn.type = learningBtn.type = "button";
        knownBtn.addEventListener("click", () => mark(i, "known"));
        learningBtn.addEventListener("click", () => mark(i, "learning"));
        actions.append(knownBtn, learningBtn);

        card.append(flip, actions);

        if (CAN_SPEAK) {
          const speakBtn = el("button", "speak-btn", "🔊");
          speakBtn.type = "button";
          speakBtn.setAttribute("aria-label", `Listen to “${word.en}”`);
          speakBtn.addEventListener("click", () => speak(word.en, speakBtn));
          card.appendChild(speakBtn);
        }
        gridEl.appendChild(card);
        renderBadge(card, progress[wordKey(activeTopic, word)]);
      });
    }

    const CAN_SPEAK = "speechSynthesis" in window;

    // Prefer a real US English voice; on an Italian-language system the default
    // voice may be Italian, which mispronounces English words. On-device voices
    // come first because online ones (e.g. "Google US English") fail offline.
    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      return voices.find(v => v.lang === "en-US" && v.localService)
        || voices.find(v => v.lang === "en-US")
        || voices.find(v => v.lang.startsWith("en"))
        || null;
    }

    function speak(text, btn) {
      speechSynthesis.cancel();
      document.querySelectorAll(".speak-btn.speaking").forEach(b => b.classList.remove("speaking"));

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = 0.85; // a little slower for learners
      const voice = pickVoice();
      if (voice) utterance.voice = voice;

      utterance.onstart = () => btn.classList.add("speaking");
      utterance.onend = utterance.onerror = () => btn.classList.remove("speaking");
      speechSynthesis.speak(utterance);
    }

    function setCurrent(card) {
      gridEl.querySelectorAll(".card.current").forEach(c => c.classList.remove("current"));
      card.classList.add("current");
    }

    function mark(index, status) {
      const cards = gridEl.querySelectorAll(".card");
      const card = cards[index];

      progress[wordKey(activeTopic, deck[index])] = status;
      saveProgress();
      recordActivity();
      // Read by the chat page to suggest a matching conversation starter
      try {
        localStorage.setItem(LAST_STUDIED_KEY, JSON.stringify({ topic: activeTopic, at: Date.now() }));
      } catch {}
      renderBadge(card, status);
      renderProgress();
      card.classList.remove("flipped");

      // Move on to the next card, favouring the ones still being learned
      const next = cards[pickNextIndex(index)];
      setCurrent(next);
      next.querySelector(".flip").focus({ preventScroll: true });
      next.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function selectTopic(id) {
      activeTopic = id;
      try { localStorage.setItem(TOPIC_KEY, id); } catch {}
      render();
    }

    function render() {
      renderTopics();
      renderProgress();
      renderGrid();
    }

    resetBtn.addEventListener("click", () => {
      for (const word of VOCAB[activeTopic].words) delete progress[wordKey(activeTopic, word)];
      saveProgress();
      // Also forget this topic as "recently studied", or the chat keeps suggesting it
      try {
        const last = JSON.parse(localStorage.getItem(LAST_STUDIED_KEY));
        if (last?.topic === activeTopic) localStorage.removeItem(LAST_STUDIED_KEY);
      } catch {}
      render();
    });

    render();

    // Only logged-in students may see this page. Offline, a device that has logged in
    // before can keep studying (the session can't be checked without a connection).
    requireAuth({ allowOffline: true }).then(() => document.documentElement.classList.remove("auth-pending"));
  </script>
</body>
</html>
