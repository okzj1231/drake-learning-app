<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sensei – English Tutor</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14B8A6" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Sensei" />
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js"></script>
  <script src="pwa.js" defer></script>
  <style>
    :root {
      --teal: #14B8A6;
      --teal-dark: #0F9F8F;
      --accent-text: #0F9F8F;
      --surface: #FFFFFF;
      --border-strong: #D6D3D1;
      --bg: #F5F5F4;
      --border: #E5E5E4;
      --text: #1C1917;
      --muted: #78716C;
      --online: #22C55E;
      --error-bg: #FEF2F2;
      --error-text: #B91C1C;
      --error-border: #FECACA;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 720px;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--teal);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .tutor-info { flex: 1; min-width: 0; }

    .tutor-name { font-weight: 600; font-size: 17px; }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
    }

    .new-chat-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }

    .new-chat-btn:hover { background: var(--bg); border-color: var(--border-strong); }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .starters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: auto 0 8px;
    }

    .starters-title {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 4px;
    }

    .starter {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      font: inherit;
      font-size: 15px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }

    .starter:hover { border-color: var(--teal); }
    .starter:active { transform: scale(0.98); }
    .starter:disabled { opacity: 0.5; cursor: default; }

    .starter.suggested {
      border-color: var(--teal);
      background: rgba(20, 184, 166, 0.06);
    }

    .starter-tag {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-text);
    }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: pop 0.2s ease-out;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--teal);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .msg.tutor {
      align-self: flex-start;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .msg.error {
      align-self: center;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
      font-size: 14px;
      max-width: 90%;
      text-align: center;
    }

    .retry-btn {
      display: block;
      margin: 8px auto 0;
      border: none;
      border-radius: 999px;
      padding: 6px 16px;
      background: var(--teal);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .retry-btn:hover { background: var(--teal-dark); }

    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Typing indicator */
    .typing {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      border-bottom-left-radius: 6px;
      padding: 12px 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .dots { display: flex; gap: 4px; }

    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30%           { transform: translateY(-6px); opacity: 1; }
    }

    /* Composer */
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 16px;
      font: inherit;
      font-size: 16px;
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .composer input:focus { border-color: var(--teal); background: var(--surface); }

    .send-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      border: none;
      border-radius: 999px;
      padding: 0 18px;
      background: var(--teal);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .send-btn:hover:not(:disabled) { background: var(--teal-dark); }
    .send-btn:disabled { opacity: 0.5; cursor: default; }
    .send-btn svg { width: 18px; height: 18px; }

    /* App navigation: top bar on desktop, bottom tab bar on mobile */
    .tabbar {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }

    .tab svg { width: 18px; height: 18px; flex-shrink: 0; }
    .tab:hover { background: var(--bg); color: var(--text); }
    .tab.active { background: rgba(20, 184, 166, 0.12); color: var(--accent-text); }

    @media (max-width: 640px) {
      .tabbar {
        order: 99;
        gap: 0;
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
        border-bottom: none;
        border-top: 1px solid var(--border);
      }
      .tab {
        flex: 1;
        flex-direction: column;
        gap: 2px;
        padding: 6px;
        font-size: 11px;
        border-radius: 12px;
      }
      .tab svg { width: 22px; height: 22px; }
      .tab.active { background: none; }
      .composer { padding-bottom: 12px; }
    }

    @media (max-width: 420px) {
      .starters { grid-template-columns: 1fr; }
      .send-btn .label { display: none; }
      .send-btn { padding: 0 14px; }
      .new-chat-btn { padding: 8px 10px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="tabbar" aria-label="Main">
      <a class="tab" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7" /><path d="M5 10v10h14V10" /></svg>
        <span>Dashboard</span>
      </a>
      <a class="tab" href="vocab.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="14" rx="2" /><path d="M8 3h11a2 2 0 0 1 2 2v12" /></svg>
        <span>Vocab</span>
      </a>
      <a class="tab active" href="index.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" /></svg>
        <span>Practice</span>
      </a>
      <a class="tab" href="dashboard.html#progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M7 16v-6M12 16V5M17 16v-3" /></svg>
        <span>Progress</span>
      </a>
    </nav>

    <header>
      <div class="avatar" aria-hidden="true">先</div>
      <div class="tutor-info">
        <div class="tutor-name">Sensei</div>
        <div class="status"><span class="status-dot"></span>Online</div>
      </div>
      <button class="new-chat-btn" id="newChatBtn" type="button">+ New chat</button>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>
    </header>

    <main class="messages" id="messages">
      <div class="starters" id="starters"></div>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <input id="input" type="text" placeholder="Type your message in English..." aria-label="Message" />
      <button class="send-btn" id="sendBtn" type="submit" aria-label="Send">
        <span class="label">Send</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </button>
    </form>
  </div>

  <script src="vocab-data.js"></script>
  <script src="activity.js"></script>
  <script>
    // Chat replies come from our serverless function (api/chat.js), which holds
    // the API key and system prompt. Nothing secret lives in this page.
    const CHAT_URL = "/api/chat";
    const SLOW_MS = 10000;     // show the "thinking hard" notice
    const TIMEOUT_MS = 20000;  // give up and offer a retry

    const messagesEl = document.getElementById("messages");
    const startersEl = document.getElementById("starters");
    const composer = document.getElementById("composer");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const newChatBtn = document.getElementById("newChatBtn");

    const SESSIONS_KEY = "sensei.chat.sessions";
    const LAST_STUDIED_KEY = "sensei.vocab.lastStudied";
    const RECENT_STUDY_MS = 7 * 24 * 60 * 60 * 1000;

    const DEFAULT_STARTERS = [
      { text: "Tell me about your day" },
      { text: "Let's practice ordering food", topic: "food" },
      { text: "Help me introduce myself", topic: "greetings" },
      { text: "I need useful travel phrases", topic: "travel" }
    ];

    // Shown first when the student recently studied that flashcard topic
    const TOPIC_STARTERS = {
      greetings: ["Let's practice small talk", "Help me introduce myself"],
      food: ["Let's practice ordering at a restaurant", "Ask me about my favorite food"],
      travel: ["Plan a trip with me in English", "Help me ask for directions"],
      business: ["Let's practice a business meeting", "Help me talk about my job"]
    };

    let history = [];
    let busy = false;
    let sessionCounted = false;
    let activeRequest = null; // AbortController of the in-flight API call
    let chatId = 0; // bumped on "New chat" so stale replies are ignored

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addBubble(text, role) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.textContent = text;
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function getRecentTopic() {
      try {
        const last = JSON.parse(localStorage.getItem(LAST_STUDIED_KEY));
        if (last && TOPIC_STARTERS[last.topic] && Date.now() - last.at < RECENT_STUDY_MS) {
          return last.topic;
        }
      } catch {}
      return null;
    }

    function renderStarters() {
      const topic = getRecentTopic();
      const suggested = topic ? TOPIC_STARTERS[topic] : [];
      // Skip defaults that cover the same topic as the suggestions
      const defaults = DEFAULT_STARTERS
        .filter(s => s.topic !== topic && !suggested.includes(s.text))
        .map(s => s.text);

      startersEl.innerHTML = "";
      const title = document.createElement("p");
      title.className = "starters-title";
      title.textContent = topic
        ? `You studied ${VOCAB[topic].label} recently. Let's use those words! ✨`
        : "Choose a topic to start practicing 👋";
      startersEl.appendChild(title);

      [...suggested, ...defaults].slice(0, 4).forEach(text => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "starter";
        btn.dataset.message = text;
        if (suggested.includes(text)) {
          btn.classList.add("suggested");
          const tag = document.createElement("span");
          tag.className = "starter-tag";
          tag.textContent = `From your ${VOCAB[topic].label} cards`;
          btn.appendChild(tag);
        }
        btn.append(text);
        startersEl.appendChild(btn);
      });
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "typing";
      el.innerHTML = '<div class="dots"><span></span><span></span><span></span></div><span class="typing-text">Sensei is typing...</span>';
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value;
      startersEl.querySelectorAll(".starter").forEach(b => (b.disabled = value));
    }

    // messages ends with the student's new message; the rest is the history
    async function callChat(messages, signal) {
      const res = await fetch(CHAT_URL, {
        method: "POST",
        signal,
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          message: messages[messages.length - 1].content,
          history: messages.slice(0, -1)
        })
      });

      const data = await res.json().catch(() => null);
      if (!res.ok) {
        throw new Error(data?.error || `Request failed (${res.status})`);
      }
      if (!data?.reply) throw new Error("Sensei didn't reply. Please try again.");
      return data.reply;
    }

    async function sendMessage(text) {
      text = text.trim();
      if (!text || busy) return;

      startersEl.style.display = "none";
      // A new message replaces any failed one waiting to be retried
      messagesEl.querySelectorAll(".retry-btn").forEach(btn => btn.remove());
      countSession();
      recordActivity();
      addBubble(text, "user");
      history.push({ role: "user", content: text });
      await requestReply();
    }

    // Resend a message whose reply failed, without adding a second user bubble
    function retry(text) {
      if (busy) return;
      history.push({ role: "user", content: text });
      requestReply();
    }

    async function requestReply() {
      setBusy(true);
      const thisChat = chatId;
      const typingEl = showTyping();
      const controller = new AbortController();
      activeRequest = controller;

      const slowTimer = setTimeout(() => {
        typingEl.querySelector(".typing-text").textContent = "Sensei is thinking hard! Please wait...";
        scrollToBottom();
      }, SLOW_MS);
      const timeoutTimer = setTimeout(() => controller.abort(), TIMEOUT_MS);

      try {
        const reply = await callChat(history, controller.signal);
        if (thisChat !== chatId) return;
        history.push({ role: "assistant", content: reply });
        typingEl.remove();
        addBubble(reply, "tutor");
      } catch (err) {
        if (thisChat !== chatId) return;
        // Drop the unanswered user turn so the next request stays valid
        const failed = history.pop();
        typingEl.remove();
        const message = err.name === "AbortError"
          ? "Something went wrong. Let's try again."
          : `Sorry, something went wrong: ${err.message}`;
        showRetry(message, failed.content);
      } finally {
        clearTimeout(slowTimer);
        clearTimeout(timeoutTimer);
        if (thisChat === chatId) {
          activeRequest = null;
          setBusy(false);
          input.focus();
        }
      }
    }

    function showRetry(message, text) {
      const bubble = addBubble(message, "error");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "retry-btn";
      btn.textContent = "Retry ↻";
      btn.addEventListener("click", () => {
        bubble.remove();
        retry(text);
      });
      bubble.appendChild(btn);
      scrollToBottom();
    }

    // A session is counted once, on the first message of each conversation
    function countSession() {
      if (sessionCounted) return;
      sessionCounted = true;
      try {
        const count = Number(localStorage.getItem(SESSIONS_KEY)) || 0;
        localStorage.setItem(SESSIONS_KEY, String(count + 1));
      } catch {}
    }

    function newChat() {
      chatId++;
      activeRequest?.abort();
      activeRequest = null;
      history = [];
      sessionCounted = false;
      messagesEl.querySelectorAll(".msg, .typing").forEach(el => el.remove());
      renderStarters();
      startersEl.style.display = "";
      setBusy(false);
      input.value = "";
      input.focus();
    }

    composer.addEventListener("submit", e => {
      e.preventDefault();
      const text = input.value;
      if (!text.trim() || busy) return;
      input.value = "";
      sendMessage(text);
    });

    startersEl.addEventListener("click", e => {
      const btn = e.target.closest(".starter");
      if (btn && !btn.disabled) sendMessage(btn.dataset.message);
    });

    newChatBtn.addEventListener("click", newChat);

    // Coming back from the flashcards via the back button restores the page from
    // cache, so refresh the suggestions if the chat hasn't started yet
    window.addEventListener("pageshow", e => {
      if (e.persisted && history.length === 0) renderStarters();
    });

    renderStarters();
  </script>
</body>
</html>
