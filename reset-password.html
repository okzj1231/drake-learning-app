<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Teacher – New password</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="topbar">
    <a class="back-link" href="login.html">← Back to log in</a>
  </div>

  <main class="card">
    <div class="brand">
      <div class="avatar" aria-hidden="true">T</div>
      <div>
        <h1>Choose a new password</h1>
        <p class="subtitle">At least 8 characters</p>
      </div>
    </div>

    <div class="notice" id="notice" role="status" hidden></div>

    <form id="form" hidden>
      <label>
        New password
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />
      </label>
      <label>
        Repeat the new password
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
      </label>
      <button class="btn btn-primary" id="submitBtn" type="submit">Save new password</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById("form");
    const notice = document.getElementById("notice");
    const submitBtn = document.getElementById("submitBtn");

    function showNotice(text, error = false) {
      notice.textContent = text;
      notice.classList.toggle("error", error);
      notice.hidden = false;
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password.length < 8) return showNotice("Your password needs at least 8 characters.", true);
      if (password !== confirm) return showNotice("The two passwords don't match.", true);

      submitBtn.disabled = true;
      try {
        const sb = await getSupabase();
        const { error } = await sb.auth.updateUser({ password });
        if (error) return showNotice(error.message, true);
        form.hidden = true;
        showNotice("Password updated! Taking you to the chat…");
        setTimeout(() => location.replace("index.html"), 1500);
      } finally {
        submitBtn.disabled = false;
      }
    });

    (async function init() {
      try {
        // The link in the reset email logs the student in for this step
        const session = await getSession();
        if (session) {
          form.hidden = false;
        } else {
          showNotice("This reset link is invalid or has expired. Please ask for a new one from the log in page.", true);
        }
      } catch (err) {
        showNotice(err.message, true);
      }
    })();
  </script>
</body>
</html>
