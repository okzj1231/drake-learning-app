<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Teacher – Dashboard</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14B8A6" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Teacher" />
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js"></script>
  <script src="pwa.js" defer></script>
  <style>
    :root {
      --teal: #14B8A6;
      --teal-dark: #0F9F8F;
      --accent-text: #0F9F8F;
      --surface: #FFFFFF;
      --border-strong: #D6D3D1;
      --bg: #F5F5F4;
      --border: #E5E5E4;
      --text: #1C1917;
      --muted: #78716C;
      --track: #E7E5E4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 720px;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
    }

    /* App navigation: top bar on desktop, bottom tab bar on mobile */
    .tabbar {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }

    .tab svg { width: 18px; height: 18px; flex-shrink: 0; }
    .tab:hover { background: var(--bg); color: var(--text); }
    .tab.active { background: rgba(20, 184, 166, 0.12); color: var(--accent-text); }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      scroll-behavior: smooth;
    }

    /* Welcome */
    .welcome { display: flex; align-items: flex-start; gap: 12px; }
    .welcome h1 { font-size: 28px; font-weight: 700; line-height: 1.2; }
    .welcome .date { margin-top: 4px; color: var(--muted); font-size: 15px; }

    h2 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* Stat tiles */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .stat-icon { font-size: 20px; }

    .stat-value {
      margin-top: 8px;
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat-label { margin-top: 6px; font-size: 13px; color: var(--muted); }

    /* Continue learning */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .action {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .action:active { transform: scale(0.98); }

    .action-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .action-icon svg { width: 22px; height: 22px; }

    .action .arrow { margin-left: auto; font-size: 18px; }

    .action.primary { background: var(--teal); color: #fff; }
    .action.primary:hover { background: var(--teal-dark); }
    .action.primary .action-icon { background: rgba(255, 255, 255, 0.2); }

    .action.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .action.secondary:hover { border-color: var(--teal); }
    .action.secondary .action-icon { background: rgba(20, 184, 166, 0.12); color: var(--accent-text); }

    /* Progress chart */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px;
    }

    .chart-summary { font-size: 14px; color: var(--muted); margin-bottom: 16px; }

    .chart {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 84px 1fr 44px;
      align-items: center;
      gap: 12px;
      padding: 4px 0;
      cursor: default;
    }

    .row-label { font-size: 14px; font-weight: 500; }

    .row-track {
      height: 14px;
      background: var(--track);
      border-radius: 4px;
      overflow: hidden;
    }

    .row-fill {
      height: 100%;
      width: 0;
      background: var(--teal);
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .row:hover .row-fill { background: var(--teal-dark); }

    .row-value {
      font-size: 14px;
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .tooltip {
      position: fixed;
      pointer-events: none;
      background: var(--text);
      color: var(--bg);
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, calc(-100% - 10px));
      transition: opacity 0.1s;
      z-index: 10;
    }

    .tooltip.visible { opacity: 1; }

    @media (max-width: 640px) {
      .tabbar {
        order: 99;
        gap: 0;
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
        border-bottom: none;
        border-top: 1px solid var(--border);
      }
      .tab {
        flex: 1;
        flex-direction: column;
        gap: 2px;
        padding: 6px;
        font-size: 11px;
        border-radius: 12px;
      }
      .tab svg { width: 22px; height: 22px; }
      .tab.active { background: none; }
    }

    @media (max-width: 520px) {
      .welcome h1 { font-size: 24px; }
      .stats { gap: 8px; }
      .stat { padding: 12px; }
      .stat-value { font-size: 26px; }
      .stat-label { font-size: 12px; }
      .actions { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      main { scroll-behavior: auto; }
      .row-fill { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="tabbar" aria-label="Main">
      <a class="tab active" href="dashboard.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7" /><path d="M5 10v10h14V10" /></svg>
        <span>Dashboard</span>
      </a>
      <a class="tab" href="vocab.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="14" rx="2" /><path d="M8 3h11a2 2 0 0 1 2 2v12" /></svg>
        <span>Vocab</span>
      </a>
      <a class="tab" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" /></svg>
        <span>Practice</span>
      </a>
      <a class="tab" href="#progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M7 16v-6M12 16V5M17 16v-3" /></svg>
        <span>Progress</span>
      </a>
    </nav>

    <main>
      <section class="welcome">
        <div>
          <h1>Welcome back! 👋</h1>
          <p class="date" id="today"></p>
        </div>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </section>

      <section class="stats" aria-label="Your stats">
        <div class="stat">
          <div class="stat-icon" aria-hidden="true">📚</div>
          <div class="stat-value" id="wordsLearned">0</div>
          <div class="stat-label">Words learned</div>
        </div>
        <div class="stat">
          <div class="stat-icon" aria-hidden="true">💬</div>
          <div class="stat-value" id="conversations">0</div>
          <div class="stat-label">Conversations</div>
        </div>
        <div class="stat">
          <div class="stat-icon" aria-hidden="true">🔥</div>
          <div class="stat-value" id="streak">0</div>
          <div class="stat-label">Day streak</div>
        </div>
      </section>

      <section>
        <h2>Continue learning</h2>
        <div class="actions">
          <a class="action primary" href="vocab.html">
            <span class="action-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="14" rx="2" /><path d="M8 3h11a2 2 0 0 1 2 2v12" /></svg>
            </span>
            Practice vocabulary
            <span class="arrow" aria-hidden="true">→</span>
          </a>
          <a class="action secondary" href="index.html">
            <span class="action-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" /></svg>
            </span>
            Chat with Teacher
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </section>

      <section id="progress">
        <h2>Your progress</h2>
        <div class="chart-card">
          <p class="chart-summary" id="chartSummary"></p>
          <ul class="chart" id="chart"></ul>
        </div>
      </section>
    </main>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <script src="vocab-data.js"></script>
  <script src="activity.js"></script>
  <script>
    const PROGRESS_KEY = "sensei.vocab.progress";
    const SESSIONS_KEY = "sensei.chat.sessions";

    function readProgress() {
      try {
        return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {};
      } catch {
        return {};
      }
    }

    function readSessions() {
      try {
        return Number(localStorage.getItem(SESSIONS_KEY)) || 0;
      } catch {
        return 0;
      }
    }

    const progress = readProgress();

    // Known / total per topic, using the same keys as vocab.html
    const topics = Object.entries(VOCAB).map(([id, topic]) => ({
      label: topic.label,
      total: topic.words.length,
      known: topic.words.filter(w => progress[`${id}:${w.en}`] === "known").length
    }));

    const totalKnown = topics.reduce((sum, t) => sum + t.known, 0);
    const totalWords = topics.reduce((sum, t) => sum + t.total, 0);
    const streak = getStreak();

    document.getElementById("today").textContent = new Date().toLocaleDateString("en-US", {
      weekday: "long", month: "long", day: "numeric", year: "numeric"
    });

    document.getElementById("wordsLearned").textContent = totalKnown;
    document.getElementById("conversations").textContent = readSessions();
    document.getElementById("streak").textContent = streak;

    document.getElementById("chartSummary").textContent = totalKnown === 0
      ? `You know 0 of ${totalWords} words. Flip some cards to get started!`
      : `You know ${totalKnown} of ${totalWords} words (${Math.round((totalKnown / totalWords) * 100)}%).`;

    const chart = document.getElementById("chart");
    const tooltip = document.getElementById("tooltip");

    for (const t of topics) {
      const pct = Math.round((t.known / t.total) * 100);

      const row = document.createElement("li");
      row.className = "row";
      row.setAttribute("aria-label", `${t.label}: ${t.known} of ${t.total} words known`);
      row.innerHTML = `
        <span class="row-label"></span>
        <div class="row-track" aria-hidden="true"><div class="row-fill"></div></div>
        <span class="row-value"></span>`;
      row.querySelector(".row-label").textContent = t.label;
      row.querySelector(".row-value").textContent = `${t.known}/${t.total}`;
      chart.appendChild(row);

      // Animate from 0 after first paint
      requestAnimationFrame(() => requestAnimationFrame(() => {
        row.querySelector(".row-fill").style.width = `${pct}%`;
      }));

      row.addEventListener("mousemove", e => {
        tooltip.textContent = `${t.label}: ${t.known} of ${t.total} known (${pct}%)`;
        tooltip.style.left = `${e.clientX}px`;
        tooltip.style.top = `${e.clientY}px`;
        tooltip.classList.add("visible");
      });
      row.addEventListener("mouseleave", () => tooltip.classList.remove("visible"));
    }
  </script>
</body>
</html>
