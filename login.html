<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Teacher – Log in</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14B8A6" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js"></script>
  <script src="pwa.js" defer></script>
</head>
<body>
  <div class="topbar">
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
    </button>
  </div>

  <main class="card">
    <div class="brand">
      <div class="avatar" aria-hidden="true">T</div>
      <div>
        <h1 id="title">Log in</h1>
        <p class="subtitle" id="subtitle">Log in to chat with Teacher</p>
      </div>
    </div>

    <div class="notice" id="notice" role="status" hidden></div>

    <form id="form" novalidate>
      <label id="nameField" hidden>
        Name
        <input id="name" type="text" autocomplete="name" maxlength="60" />
      </label>
      <label>
        Email
        <input id="email" type="email" autocomplete="email" required />
      </label>
      <label id="passwordField">
        Password
        <input id="password" type="password" autocomplete="current-password" minlength="8" required />
      </label>
      <button class="btn btn-primary" id="submitBtn" type="submit">Log in</button>
    </form>

    <p class="switch" id="forgotRow">
      <button class="link-btn" type="button" data-mode="forgot">Forgot your password?</button>
    </p>

    <div id="googleBlock" hidden>
      <div class="divider">or</div>
      <button class="btn btn-secondary" id="googleBtn" type="button" style="width: 100%;">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </button>
    </div>

    <p class="switch" id="switchRow"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    const MODES = {
      login: {
        title: "Log in", subtitle: "Log in to chat with Teacher", submit: "Log in",
        switchText: "New here?", switchLabel: "Create an account", switchTo: "signup"
      },
      signup: {
        title: "Create your account", subtitle: "Practice English with Teacher", submit: "Sign up",
        switchText: "Already have an account?", switchLabel: "Log in", switchTo: "login"
      },
      forgot: {
        title: "Reset your password", subtitle: "We'll email you a link to choose a new one", submit: "Send reset link",
        switchText: "Remembered it?", switchLabel: "Back to log in", switchTo: "login"
      }
    };

    const params = new URLSearchParams(location.search);
    const nextPage = safeReturnPage(params.get("next"));

    const form = document.getElementById("form");
    const notice = document.getElementById("notice");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");

    let mode = "login";

    function showNotice(text, { error = false, action = null } = {}) {
      notice.textContent = text;
      notice.classList.toggle("error", error);
      if (action) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "link-btn";
        btn.textContent = action.label;
        btn.addEventListener("click", action.onClick);
        notice.append(document.createElement("br"), btn);
      }
      notice.hidden = false;
    }

    function hideNotice() {
      notice.hidden = true;
    }

    function setMode(newMode) {
      mode = newMode;
      const m = MODES[mode];
      document.getElementById("title").textContent = m.title;
      document.getElementById("subtitle").textContent = m.subtitle;
      document.title = `Teacher – ${m.title}`;
      submitBtn.textContent = m.submit;
      document.getElementById("nameField").hidden = mode !== "signup";
      document.getElementById("passwordField").hidden = mode === "forgot";
      document.getElementById("forgotRow").hidden = mode !== "login";
      passwordInput.autocomplete = mode === "signup" ? "new-password" : "current-password";

      const row = document.getElementById("switchRow");
      row.textContent = `${m.switchText} `;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "link-btn";
      btn.dataset.mode = m.switchTo;
      btn.textContent = m.switchLabel;
      row.appendChild(btn);
      hideNotice();
    }

    document.addEventListener("click", e => {
      const target = e.target.closest("[data-mode]");
      if (target) setMode(target.dataset.mode);
    });

    function redirectUrl(page) {
      return new URL(page, location.href).href;
    }

    async function resendVerification(email) {
      const sb = await getSupabase();
      const { error } = await sb.auth.resend({
        type: "signup",
        email,
        options: { emailRedirectTo: redirectUrl(nextPage) }
      });
      showNotice(error ? `Couldn't send the email: ${error.message}` : "Verification email sent. Check your inbox.", { error: !!error });
    }

    async function handleLogin(sb, email, password) {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (!error) return location.replace(nextPage);

      if (error.code === "email_not_confirmed") {
        showNotice("Please verify your email first. Check your inbox for the link.", {
          error: true,
          action: { label: "Resend verification email", onClick: () => resendVerification(email) }
        });
      } else if (error.code === "invalid_credentials") {
        showNotice("Wrong email or password.", { error: true });
      } else {
        showNotice(error.message, { error: true });
      }
    }

    async function handleSignup(sb, email, password) {
      const name = nameInput.value.trim();
      if (!name) return showNotice("Please enter your name.", { error: true });
      if (password.length < 8) return showNotice("Your password needs at least 8 characters.", { error: true });

      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: name },
          emailRedirectTo: redirectUrl(nextPage)
        }
      });
      if (error) return showNotice(error.message, { error: true });

      // Email confirmation on (the default): no session until the link is clicked
      if (!data.session) {
        setMode("login");
        emailInput.value = email;
        showNotice(`Almost done! We sent a verification link to ${email}. Click it, then log in.`);
      } else {
        location.replace(nextPage);
      }
    }

    async function handleForgot(sb, email) {
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: redirectUrl("reset-password.html")
      });
      if (error) return showNotice(error.message, { error: true });
      // Same message whether or not the account exists, so emails can't be probed
      showNotice(`If an account exists for ${email}, you'll get an email with a reset link.`);
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email) return showNotice("Please enter your email.", { error: true });
      if (mode !== "forgot" && !password) return showNotice("Please enter your password.", { error: true });

      submitBtn.disabled = true;
      hideNotice();
      try {
        const sb = await getSupabase();
        if (mode === "login") await handleLogin(sb, email, password);
        else if (mode === "signup") await handleSignup(sb, email, password);
        else await handleForgot(sb, email);
      } catch (err) {
        showNotice(err.message || "Something went wrong. Please try again.", { error: true });
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.getElementById("googleBtn").addEventListener("click", async () => {
      try {
        const sb = await getSupabase();
        const { error } = await sb.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: redirectUrl(nextPage) }
        });
        if (error) showNotice(error.message, { error: true });
      } catch (err) {
        showNotice(err.message, { error: true });
      }
    });

    (async function init() {
      setMode(params.get("mode") in MODES ? params.get("mode") : "login");
      try {
        // Already logged in (or just back from an email link): go straight on
        if (await getSession()) return location.replace(nextPage);
        const config = await getAuthConfig();
        document.getElementById("googleBlock").hidden = !config.googleEnabled;
      } catch (err) {
        showNotice(err.message, { error: true });
      }
    })();
  </script>
</body>
</html>
