<!DOCTYPE html>
<html lang="en" class="auth-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Teacher – Profile</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14B8A6" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js"></script>
  <script src="pwa.js" defer></script>
  <style>
    /* Hidden until the login check finishes, so logged-out visitors never see the page */
    .auth-pending body { visibility: hidden; }

    .card + .card { margin-top: 16px; }
    h2 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }

    .row { display: flex; gap: 8px; }
    .row input { flex: 1; min-width: 0; }

    .history { list-style: none; display: flex; flex-direction: column; }

    .history a {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
    }

    .history li:last-child a { border-bottom: none; }
    .history a:hover .title { color: var(--accent-text); }
    .history .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history .date { color: var(--muted); font-size: 13px; flex-shrink: 0; }
    .empty { color: var(--muted); font-size: 14px; }

    #logoutBtn { width: 100%; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back-link" href="index.html">← Back to chat</a>
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
    </button>
  </div>

  <main class="card">
    <div class="brand">
      <div class="avatar" id="initial" aria-hidden="true"></div>
      <div>
        <h1 id="nameHeading"></h1>
        <p class="subtitle" id="emailLine"></p>
      </div>
    </div>

    <div class="notice" id="notice" role="status" hidden></div>

    <form id="nameForm">
      <label>
        Name
        <div class="row">
          <input id="name" type="text" autocomplete="name" maxlength="60" required />
          <button class="btn btn-primary" id="saveBtn" type="submit">Save</button>
        </div>
      </label>
      <label>
        Email
        <input id="email" type="email" readonly />
      </label>
    </form>

    <button class="btn btn-secondary" id="logoutBtn" type="button">Log out</button>
  </main>

  <section class="card">
    <h2>Your conversations</h2>
    <ul class="history" id="history"></ul>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    const notice = document.getElementById("notice");
    const nameInput = document.getElementById("name");

    function showNotice(text, error = false) {
      notice.textContent = text;
      notice.classList.toggle("error", error);
      notice.hidden = false;
    }

    function renderUser(user) {
      const name = displayName(user);
      document.getElementById("initial").textContent = (name[0] || "?").toUpperCase();
      document.getElementById("nameHeading").textContent = name;
      document.getElementById("emailLine").textContent = user.email;
      nameInput.value = name;
      document.getElementById("email").value = user.email;
    }

    async function renderHistory(sb) {
      const list = document.getElementById("history");
      // Row-level security only returns this user's conversations
      const { data, error } = await sb
        .from("conversations")
        .select("id, title, updated_at")
        .order("updated_at", { ascending: false })
        .limit(30);

      list.innerHTML = "";
      if (error || !data.length) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = error ? "Couldn't load your conversations." : "No conversations yet. Start one in the chat!";
        list.appendChild(li);
        return;
      }

      for (const c of data) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = `index.html?c=${encodeURIComponent(c.id)}`;
        const title = document.createElement("span");
        title.className = "title";
        title.textContent = c.title;
        const date = document.createElement("span");
        date.className = "date";
        date.textContent = new Date(c.updated_at).toLocaleDateString("en-US", { month: "short", day: "numeric" });
        a.append(title, date);
        li.appendChild(a);
        list.appendChild(li);
      }
    }

    document.getElementById("nameForm").addEventListener("submit", async e => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name) return showNotice("Please enter your name.", true);
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      try {
        const sb = await getSupabase();
        const { data, error } = await sb.auth.updateUser({ data: { full_name: name } });
        if (error) return showNotice(error.message, true);
        renderUser(data.user);
        showNotice("Name saved.");
      } finally {
        saveBtn.disabled = false;
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", signOut);

    (async function init() {
      const session = await requireAuth();
      document.documentElement.classList.remove("auth-pending");
      renderUser(session.user);
      renderHistory(await getSupabase());
    })();
  </script>
</body>
</html>
